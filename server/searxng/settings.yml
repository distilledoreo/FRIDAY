use_default_settings: true

server:
  secret_key: "CHANGE_ME"  # scripts/setup.sh replaces this with a random key
  limiter: false

search:
  formats:
    - html
    - json

# Bing alongside the defaults: when DuckDuckGo, Brave, Google CSE and Wikipedia throttle a burst of searches,
# they all answer nothing at once, and research gets empty results.
engines:
  - name: bing
    disabled: false
