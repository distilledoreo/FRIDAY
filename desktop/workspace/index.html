<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRIDAY</title><link rel="stylesheet" href="/workspace-ui.css"><script src="/workspace-ui.js" defer></script></head>
<body><header><h1>FRIDAY</h1><span id="status" role="status">Connect with your existing desktop API token.</span></header>
<section id="login"><label>API token <input id="token" type="password" autocomplete="off"></label><button id="connect">Connect</button><p>The token stays in this tab’s memory. Chats and files remain on your computer.</p></section>
<main id="workspace" hidden><aside><button id="refresh">Refresh</button><button id="new">New chat</button><button id="lock">Lock</button><input id="search" type="search" placeholder="Search synced chats" aria-label="Search synced chats"><div id="chats"></div><h2>Tasks</h2><div id="jobs"></div></aside>
<section id="chat"><h2 id="title">Choose a chat</h2><button id="rename">Rename chat</button><button id="deleteChat">Delete chat</button><label>Project <select id="project"><option value="">General chat</option></select></label><div id="messages" aria-live="polite"></div><label>Message<textarea id="draft" rows="4"></textarea></label><button id="send">Send on computer</button><button id="schedule">Run as background research</button><label>Attach file <input id="file" type="file"></label><div id="attachments"></div><p>Computer tools can research, calculate, and create files. Phone actions are available in the Android app.</p><details><summary>Shared preferences</summary>
<label>Theme<select id="pref-theme"><option value="DARK">Dark</option><option value="LIGHT">Light</option><option value="SYSTEM">Follow system</option></select></label>
<label>Accent color<input id="pref-accent" type="color" value="#e89980"></label>
<label>Display name<input id="pref-display_name" maxlength="60"></label>
<label>Proactivity<select id="pref-proactivity"><option value="CONSERVATIVE">Conservative</option><option value="THOUGHTFUL">Thoughtfully proactive</option><option value="HIGH">Highly proactive</option></select></label>
<label><input id="pref-reduced_motion" type="checkbox"> Reduce motion</label>
<label><input id="pref-interactive_answers" type="checkbox" checked> Allow interactive answers on supported clients</label>
</details><h2>Shared memory</h2><div id="memorySettings"></div><div id="memories"></div><label>New memory<input id="memory"></label><button id="saveMemory">Save memory</button></section></main></body></html>
